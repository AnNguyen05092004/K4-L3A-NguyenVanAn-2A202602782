[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4-day08-rag-pipeline"
version = "0.1.0"
description = "Day 8 lab for building and evaluating a RAG pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.40.0,<2",
    "chromadb>=0.5.0,<2",
    "crawl4ai==0.9.3",
    "datasets>=4.0.0,<6",
    "fpdf2>=2.7.0,<3",
    "google-genai>=1.0.0,<3",
    "langchain-community==0.4.1",
    "langchain-openai>=1.6.2,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "markitdown[pdf]>=0.1.0,<0.2",
    "numpy>=1.26.0,<3",
    "openai>=2.45.0,<3",
    "pageindex==0.2.8",
    "pdf2image>=1.17.0,<2",
    "pytesseract>=0.3.10,<0.4",
    "python-dotenv>=1.0.0,<2",
    "ragas==0.4.3",
    "rank-bm25>=0.2.2,<0.3",
    "requests>=2.31.0,<3",
    "scikit-learn>=1.3.0,<2",
    "sentence-transformers>=2.2.0,<7",
    "streamlit>=1.35.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
